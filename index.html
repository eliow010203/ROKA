<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{padding: 0px; margin: 0px;}
        .button{
            padding: 10px;
            background-color: #333;
            color: #fff;
            font-weight: bold;
            transition: .3s;
            text-align: center;
            border-radius: 7px;
        }
        .button:hover{
            background-color: #ccc;
            color: #333;
        }
        #modal{
            width: 400px;
            height: 120px;
            border-radius: 7px;
            transition: .3s;
            opacity: 0;
            position: absolute;
            top: 0px;
            pointer-events: none;
            background-color: #fff;
            margin: 20px;
            box-shadow: #000000aa 0px 0px 20px;
        }
        #open{
            width: 200px;
        }
        #close{
            width: 100px;
        }


    </style>
</head>
<body>
    <div class="button" id="open">View more details</div>
    <div id="modal">
        <p>this is more info</p>
        <div class="button" id="close">close</div>
    </div>
    <script defer>
        let num = 0
        let openbtn = document.getElementById("open")
        let modal = document.getElementById("modal")
        let closebtn = document.getElementById("close")
        openbtn.addEventListener("mousedown",()=>{
            modal.style.opacity="1"
            modal.style.pointerEvents="all"
        })
        closebtn.addEventListener("mousedown",()=>{
            modal.style.opacity="0"
            modal.style.pointerEvents="none"
        })
    </script>
</body>
</html>
